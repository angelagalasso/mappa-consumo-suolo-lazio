        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati

                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);

        // === MODIFICHE: cerchi proporzionali al numero di agriturismi ===
        // area del cerchio proporzionale al numero: raggio = K * radice(numero)
        var K_CERCHI = 2.0;   // per cerchi più grandi o più piccoli cambiare questo valore
        function raggioAgri(n) { return K_CERCHI * Math.sqrt(n); }
        function centroComune(geom) {
            var poli = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
            var best = null, bestA = -1;
            poli.forEach(function (p) {
                var r = p[0], a = 0, cx = 0, cy = 0;
                for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
                    var k = r[j][0] * r[i][1] - r[i][0] * r[j][1];
                    a += k; cx += (r[j][0] + r[i][0]) * k; cy += (r[j][1] + r[i][1]) * k;
                }
                if (a !== 0 && Math.abs(a) > bestA) { bestA = Math.abs(a); best = [cy / (3 * a), cx / (3 * a)]; }
            });
            return best;
        }

                });
                cerchio.bindTooltip(esc(e.p['COMUNE']) + ' – ' + e.n + (e.n === 1 ? ' agriturismo' : ' agriturismi'),
                    {sticky: true, direction: 'top', offset: [0, -6], className: 'tt-comune'});
                cerchio.bindPopup(popupComune(e.p), { maxHeight: 400 });
                layer_cerchiAgri.addLayer(cerchio);
            });
        })();
        map.addLayer(layer_cerchiAgri);
        function legendaCerchi() {
            var valori = [50, 20, 5], rMax = raggioAgri(valori[0]);
            var passo = 15, base = Math.max(2 * rMax + 6, valori.length * passo + 4);
            var cx = rMax + 2, xGomito = 2 * rMax + 10, xTesto = 2 * rMax + 26;
            var svg = '<svg width="' + (xTesto + 95) + '" height="' + (base + 3) + '" style="display:block;margin:4px 0 2px 4px">';
            valori.forEach(function (n, k) {
                var r = raggioAgri(n), top = base - 2 * r, yTesto = 11 + k * passo;
                svg += '<circle cx="' + cx + '" cy="' + (base - r) + '" r="' + r + '" fill="rgba(8,48,107,0.65)" stroke="#fff" stroke-width="0.8"/>';
                svg += '<polyline points="' + cx + ',' + top + ' ' + xGomito + ',' + top + ' ' + (xTesto - 4) + ',' + (yTesto - 4) +
                       '" fill="none" stroke="#777" stroke-width="0.7"/>';
                svg += '<text x="' + xTesto + '" y="' + yTesto + '" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333">' +
                       n + ' agriturismi</text>';
            });
            return svg + '</svg>';
        }
        var overlaysTree = [
            {label: 'Agriturismi con alloggio per comune (ISTAT 2024)' + legendaCerchi(), layer: layer_cerchiAgri},
            {label: '<img src="legend/Province_1.png" /> Confini provinciali', layer: layer_Province_1},
            {label: 'Consumo di suolo netto 2024-2025 (ettari ogni 100 km²)<br /><table><tr><td style="text-align: center;"><img src="legend/Consumodisuolonetto20242025ettariogni100km_0_nessunconsumonetto0.png" /></td><td>nessun consumo netto</td></tr><tr><td style="text-align: center;"><img src="legend/Consumodisuolonetto20242025ettariogni100km_0_finoa051.png" /></td><td>fino a 0,5</td></tr><tr><td style="text-align: center;"><img src="legend/Consumodisuolonetto20242025ettariogni100km_0_oltre05finoa32.png" /></td><td>oltre 0,5 fino a 3</td></tr><tr><td style="text-align: center;"><img src="legend/Consumodisuolonetto20242025ettariogni100km_0_oltre3finoa203.png" /></td><td>oltre 3 fino a 20</td></tr><tr><td style="text-align: center;"><img src="legend/Consumodisuolonetto20242025ettariogni100km_0_oltre204.png" /></td><td>oltre 20</td></tr></table>', layer: layer_Consumodisuolonetto20242025ettariogni100km_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false, 
        });
        lay.addTo(map);
		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        function inquadraLazio() {
            var b = layer_Consumodisuolonetto20242025ettariogni100km_0.getBounds();
            if (window.innerWidth >= 900) {
                map.fitBounds(b, {paddingTopLeft: [20, 20], paddingBottomRight: [400, 20]});
            } else {
                map.fitBounds(b, {padding: [10, 10]});
            }
        }
        inquadraLazio();
        setTimeout(inquadraLazio, 700);
        resetLabels([layer_Consumodisuolonetto20242025ettariogni100km_0]);
        map.on("zoomend", function(){
            resetLabels([layer_Consumodisuolonetto20242025ettariogni100km_0]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Consumodisuolonetto20242025ettariogni100km_0]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Consumodisuolonetto20242025ettariogni100km_0]);
        });

        // === MODIFICHE: ricerca del comune ===
        (function () {
            var indice = {};
            layer_Consumodisuolonetto20242025ettariogni100km_0.eachLayer(function (l) {
                indice[String(l.feature.properties['COMUNE']).toLowerCase()] = l;
            });
            var nomi = Object.keys(indice).map(function (k) { return indice[k].feature.properties['COMUNE']; })
                .sort(function (a, b) { return a.localeCompare(b, 'it'); });
            var Cerca = L.Control.extend({
                options: { position: 'topleft' },
                onAdd: function () {
                    var d = L.DomUtil.create('div', 'leaflet-control');
                    d.id = 'cerca-comune';
                    d.innerHTML = '<input type="search" list="elenco-comuni" placeholder="Cerca un comune…" aria-label="Cerca un comune">' +
                        '<datalist id="elenco-comuni">' + nomi.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
                    L.DomEvent.disableClickPropagation(d);
                    L.DomEvent.disableScrollPropagation(d);
                    var inp = d.querySelector('input');
                    function vai() {
                        var l = indice[inp.value.trim().toLowerCase()];
                        if (!l) return;
                        map.fitBounds(l.getBounds(), {maxZoom: 11, padding: [40, 40]});
                        setTimeout(function () { l.openPopup(l.getBounds().getCenter()); }, 400);
                        inp.blur();
                    }
                    inp.addEventListener('change', vai);
                    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') vai(); });
                    return d;
                }
            });
            new Cerca().addTo(map);
        })();

        // === MODIFICHE: riquadro con titolo, guida e fonti ===
        (function () {
            var box = document.createElement('div');
            box.id = 'info-mappa';
            box.innerHTML = '<details open><summary>Consumo di suolo e agriturismi nel Lazio</summary>' +
                '<p>I colori indicano il <b>consumo di suolo netto 2024-2025</b> in ettari ogni 100 km² di superficie comunale; ' +
                'i <b>cerchi blu</b> il numero di agriturismi con alloggio di ogni comune (area proporzionale al numero).</p>' +
                '<p>Clicca su un comune o cerca il suo nome in alto a sinistra per vedere i dati.</p>' +
                '<p>Il commento ai dati è nell\'articolo <a href="https://angelagalasso.com/2026/10/28/consumo-di-suolo-nel-lazio-1-417-ettari-in-un-anno-due-terzi-nella-tuscia-degli-agriturismi/" target="_blank" rel="noopener">' +
                'Consumo di suolo nel Lazio: 1.417 ettari in un anno, due terzi nella Tuscia degli agriturismi</a>.</p>' +
                '<p class="fonti">Fonti: ISPRA-SNPA, <i>Consumo di suolo, ecosistemi urbani e stato del territorio</i>, ed. 2026 (licenza CC BY 4.0); ' +
                'ISTAT, Capacità degli esercizi ricettivi, agriturismi con alloggio per comune (2024); confini comunali ISTAT al 1/1/2026. ' +
                'Consumo netto: nuove superfici artificiali meno quelle ripristinate; comprende anche coperture reversibili come il fotovoltaico a terra.<br>' +
                'Elaborazione e mappa: Angela Galasso.</p></details>';
            document.body.appendChild(box);
            L.DomEvent.disableClickPropagation(box);
            L.DomEvent.disableScrollPropagation(box);
            if (window.innerWidth < 650) box.querySelector('details').removeAttribute('open');
        })();
        </script>
    </body>
